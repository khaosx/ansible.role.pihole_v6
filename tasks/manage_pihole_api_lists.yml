---
- name: Manage Pihole Api Lists | Assert admin password is provided
  ansible.builtin.assert:
    that:
      - pihole_v6_admin_password is defined
      - pihole_v6_admin_password is string
      - pihole_v6_admin_password | length > 0
    fail_msg: "pihole_v6_admin_password must be set to manage lists via API."
  no_log: true

- name: Manage Pihole Api Lists | Wait for API endpoint to be reachable
  ansible.builtin.wait_for:
    host: "{{ pihole_v6_api_host }}"
    port: "{{ pihole_v6_api_port }}"
    timeout: "{{ pihole_v6_api_wait_timeout }}"

- name: Manage Pihole Api Lists | Authenticate and obtain session tokens
  ansible.builtin.uri:
    url: "{{ pihole_v6_api_base_url }}/api/auth"
    method: POST
    body_format: json
    body:
      password: "{{ pihole_v6_admin_password }}"
    return_content: true
    follow_redirects: all
    status_code: 200
    timeout: "{{ pihole_v6_api_timeout }}"
    validate_certs: "{{ pihole_v6_api_validate_certs }}"
  register: __pihole_v6_auth
  no_log: true

- name: Manage Pihole Api Lists | Build session and CSRF headers
  ansible.builtin.set_fact:
    __pihole_v6_auth_header:
      Cookie: "sid={{ __pihole_v6_auth.json.session.sid }}"
      X-CSRF-TOKEN: "{{ __pihole_v6_auth.json.session.csrf }}"
  when:
    - __pihole_v6_auth.json.session.sid is defined
    - __pihole_v6_auth.json.session.csrf is defined
  no_log: true

- name: Manage Pihole Api Lists | Read current adlists
  ansible.builtin.uri:
    url: "{{ pihole_v6_api_base_url }}/api/lists?type=block"
    method: GET
    headers: "{{ __pihole_v6_auth_header }}"
    return_content: true
    follow_redirects: all
    status_code: 200
    timeout: "{{ pihole_v6_api_timeout }}"
    validate_certs: "{{ pihole_v6_api_validate_certs }}"
  register: __pihole_v6_lists_get
  when: __pihole_v6_auth_header is defined
  no_log: true

- name: Manage Pihole Api Lists | Extract current adlist addresses
  ansible.builtin.set_fact:
    __pihole_v6_current_adlists: "{{ __pihole_v6_lists_get.json.lists | map(attribute='address') | list }}"
  when:
    - __pihole_v6_auth_header is defined
    - __pihole_v6_lists_get.json.lists is defined

- name: Manage Pihole Api Lists | Ensure desired adlists are present
  ansible.builtin.uri:
    url: "{{ pihole_v6_api_base_url }}/api/lists?type={{ item['type'] }}"
    method: POST
    headers: "{{ __pihole_v6_auth_header }}"
    body_format: json
    body:
      address: "{{ item['address'] }}"
      comment: "{{ item['comment'] | default('managed-by-ansible') }}"
      groups: "{{ item['groups'] | default([0]) }}"
      enabled: "{{ (item['enabled'] | default(true)) | bool }}"
    follow_redirects: all
    status_code: [200, 201]
    timeout: "{{ pihole_v6_api_timeout }}"
    validate_certs: "{{ pihole_v6_api_validate_certs }}"
  loop: "{{ pihole_v6_adlists_present }}"
  loop_control:
    label: "{{ item['address'] }}"
  when:
    - __pihole_v6_auth_header is defined
    - item['address'] not in __pihole_v6_current_adlists
  notify: Pihole_v6 | Update gravity database
  no_log: true

- name: Manage Pihole Api Lists | Delete default adlist when present
  ansible.builtin.uri:
    url: >-
      {{ pihole_v6_api_base_url }}/api/lists/{{ pihole_v6_default_list_address | urlencode }}?type=block
    method: DELETE
    headers: "{{ __pihole_v6_auth_header }}"
    follow_redirects: all
    status_code: [200, 204]
    timeout: "{{ pihole_v6_api_timeout }}"
    validate_certs: "{{ pihole_v6_api_validate_certs }}"
  when:
    - __pihole_v6_auth_header is defined
    - pihole_v6_delete_default_list | bool
    - pihole_v6_default_list_address in __pihole_v6_current_adlists
  notify: Pihole_v6 | Update gravity database
  no_log: true
