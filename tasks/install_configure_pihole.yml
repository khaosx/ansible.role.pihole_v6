---
- name: Install Configure Pihole | Assert required web password hashes are provided
  ansible.builtin.assert:
    that:
      - pihole_v6_webserver_pwhash is defined
      - pihole_v6_webserver_pwhash | length > 0
      - pihole_v6_webserver_app_pwhash is defined
      - pihole_v6_webserver_app_pwhash | length > 0
    fail_msg: >-
      pihole_v6_webserver_pwhash and pihole_v6_webserver_app_pwhash must be defined.
  no_log: true

- name: Install Configure Pihole | Ensure pihole group exists
  ansible.builtin.group:
    name: pihole
    state: present

- name: Install Configure Pihole | Ensure pihole user exists
  ansible.builtin.user:
    name: pihole
    home: "/home/pihole"
    shell: "/usr/sbin/nologin"
    comment: "Pi-hole service account"
    group: pihole
    password: "*"
    state: present

- name: Install Configure Pihole | Ensure configuration directory exists
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    owner: pihole
    group: pihole
    mode: "0775"

- name: Install Configure Pihole | Deploy pihole.toml
  ansible.builtin.template:
    src: pihole.toml.j2
    dest: /etc/pihole/pihole.toml
    owner: pihole
    group: pihole
    mode: "0644"
    force: "{{ pihole_v6_toml_force | bool }}"
    backup: true
  notify: Pihole_v6 | Restart Pi-hole FTL service

- name: Install Configure Pihole | Check if Pi-hole binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/pihole
  register: __pihole_v6_installed
  changed_when: false

- name: Install Configure Pihole | Install Pi-hole when missing
  when: not __pihole_v6_installed.stat.exists
  notify: Pihole_v6 | Restart Pi-hole FTL service
  block:
    - name: Install Configure Pihole | Download installer script
      ansible.builtin.get_url:
        url: "{{ pihole_v6_install_script_url }}"
        dest: /tmp/pihole-install.sh
        owner: root
        group: root
        mode: "0755"

    # command is required because Pi-hole installation is distributed as an installer script.
    - name: Install Configure Pihole | Run unattended installer
      ansible.builtin.command: bash /tmp/pihole-install.sh --unattended
      args:
        creates: /etc/systemd/system/pihole-FTL.service
      changed_when: true
      when: not ansible_check_mode

- name: Install Configure Pihole | Ensure FTL service is enabled and running
  ansible.builtin.systemd:
    name: "{{ __pihole_v6_ftl_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Install Configure Pihole | Remove installer script
  ansible.builtin.file:
    path: /tmp/pihole-install.sh
    state: absent
