---
- name: Test Pihole | Determine DNS bind address
  ansible.builtin.set_fact:
    __pihole_v6_bind_addr: "{{ ansible_facts['default_ipv4']['address'] }}"

# command is required because dig output is used directly for DNS smoke validation.
- name: Test Pihole | Verify pi-hole.net resolves
  ansible.builtin.command: dig +short pi-hole.net @{{ __pihole_v6_bind_addr }}
  register: __pihole_v6_dns_pi_hole_net
  failed_when: __pihole_v6_dns_pi_hole_net.stdout == ""
  changed_when: false

# command is required because dig output is used directly for DNS smoke validation.
- name: Test Pihole | Verify ad domain is blocked
  ansible.builtin.command: dig +short es.000webhost.com @{{ __pihole_v6_bind_addr }}
  register: __pihole_v6_dns_ad_domain
  failed_when: >-
    __pihole_v6_dns_ad_domain.stdout != "" and
    ('0.0.0.0' not in __pihole_v6_dns_ad_domain.stdout)
  changed_when: false

# command is required because dig output is used directly for DNSSEC smoke validation.
- name: Test Pihole | Verify DNSSEC failure behavior
  ansible.builtin.command: dig +short sigfail.verteiltesysteme.net @{{ __pihole_v6_bind_addr }}
  register: __pihole_v6_dnssec_sigfail
  failed_when: __pihole_v6_dnssec_sigfail.stdout != ""
  changed_when: false
  when: pihole_v6_setup_dnssec | bool

# command is required because dig output is used directly for DNSSEC smoke validation.
- name: Test Pihole | Verify DNSSEC success behavior
  ansible.builtin.command: dig +short sigok.verteiltesysteme.net @{{ __pihole_v6_bind_addr }}
  register: __pihole_v6_dnssec_sigok
  failed_when: __pihole_v6_dnssec_sigok.stdout == ""
  changed_when: false
  when: pihole_v6_setup_dnssec | bool
