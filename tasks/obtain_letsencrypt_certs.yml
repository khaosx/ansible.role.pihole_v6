---
- name: Obtain Letsencrypt Certs | Assert Cloudflare API token is present
  ansible.builtin.assert:
    that:
      - pihole_v6_tls_cloudflare_api_token | length > 0
    fail_msg: "Missing Cloudflare token (pihole_v6_tls_cloudflare_api_token)."
  no_log: true

- name: Obtain Letsencrypt Certs | Install certbot packages
  ansible.builtin.apt:
    name: "{{ pihole_v6_tls_packages }}"
    state: present
    update_cache: true

- name: Obtain Letsencrypt Certs | Ensure credentials directory exists
  ansible.builtin.file:
    path: "{{ pihole_v6_tls_cf_creds_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Obtain Letsencrypt Certs | Write Cloudflare credentials file
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: "{{ pihole_v6_tls_cf_creds_file }}"
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: true

- name: Obtain Letsencrypt Certs | Check if certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ pihole_v6_tls_domain }}/fullchain.pem"
  register: __pihole_v6_live_cert

# command is required because certbot certificate issuance is CLI-driven.
- name: Obtain Letsencrypt Certs | Issue certificate
  ansible.builtin.command:
    argv:
      - /usr/bin/certbot
      - certonly
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ pihole_v6_tls_email }}"
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - "{{ pihole_v6_tls_cf_creds_file }}"
      - --dns-cloudflare-propagation-seconds
      - "{{ pihole_v6_tls_dns_propagation_seconds | string }}"
      - --server
      - "{{ pihole_v6_tls_acme_directory_urls[pihole_v6_tls_acme_server] }}"
      - -d
      - "{{ pihole_v6_tls_domain }}"
  register: __pihole_v6_certbot_issue
  retries: "{{ pihole_v6_tls_issue_retries | int + 1 }}"
  delay: "{{ pihole_v6_tls_issue_delay_seconds | int }}"
  until: __pihole_v6_certbot_issue.rc == 0
  changed_when: not __pihole_v6_live_cert.stat.exists
  when:
    - not __pihole_v6_live_cert.stat.exists
    - not ansible_check_mode

- name: Obtain Letsencrypt Certs | Ensure deploy-hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Obtain Letsencrypt Certs | Install renewal deploy hook
  ansible.builtin.template:
    src: pihole-ftl-renewal.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/pihole-ftl-renewal.sh
    owner: root
    group: root
    mode: "0755"
    backup: true

# shell is required for atomic concatenate+compare+install in a single remote execution.
- name: Obtain Letsencrypt Certs | Rebuild Pi-hole PEM when certificate content changed
  ansible.builtin.shell: |
    set -eu
    LIVE_DIR="/etc/letsencrypt/live/{{ pihole_v6_tls_domain }}"
    TMP="$(mktemp)"
    trap 'rm -f "$TMP"' EXIT
    cat "$LIVE_DIR/fullchain.pem" "$LIVE_DIR/privkey.pem" > "$TMP"
    if ! cmp -s "$TMP" "{{ pihole_v6_tls_pem_path }}"; then
      install -m {{ pihole_v6_tls_pem_mode | quote }} \
        -o {{ pihole_v6_tls_pem_owner | quote }} \
        -g {{ pihole_v6_tls_pem_group | quote }} \
        "$TMP" "{{ pihole_v6_tls_pem_path }}"
      echo CHANGED
    fi
  register: __pihole_v6_pem_update
  changed_when: "'CHANGED' in __pihole_v6_pem_update.stdout"
  when:
    - __pihole_v6_live_cert.stat.exists or (__pihole_v6_certbot_issue is defined and __pihole_v6_certbot_issue.rc == 0)
    - not ansible_check_mode
  notify: Pihole_v6 | Restart Pi-hole FTL service

- name: Obtain Letsencrypt Certs | Ensure PEM ownership and permissions are correct
  ansible.builtin.file:
    path: "{{ pihole_v6_tls_pem_path }}"
    owner: "{{ pihole_v6_tls_pem_owner }}"
    group: "{{ pihole_v6_tls_pem_group }}"
    mode: "{{ pihole_v6_tls_pem_mode }}"
  when: __pihole_v6_live_cert.stat.exists or (__pihole_v6_certbot_issue is defined and __pihole_v6_certbot_issue.changed)
